plugins { id 'com.android.application' }

def ksFile = new File('C:/Users/PASSECOUTRIN/Documents/GitHub/cold-impact-missions-android/keystore.properties')   // cle d'envoi de Cold Impact! (SHA1 AA:D9:57:D1:...:6A:59)
def ks = new Properties(); if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
def vjFile = new File(rootDir, '../version.json')
def vj = vjFile.exists() ? new groovy.json.JsonSlurper().parse(vjFile).v : 'dev'

android {
    namespace 'com.coldimpact.game'
    compileSdk 36
    defaultConfig {
        applicationId 'com.king6code.coldimpactmissions'
        minSdk 24
        targetSdk 36
        versionCode = Integer.parseInt(String.valueOf(project.findProperty('vcode') ?: '2'))
        versionName "0.1.0 (${vj})"
    }
    signingConfigs {
        release {
            if (ks.containsKey('storeFile')) { storeFile file(ks['storeFile']); storePassword ks['storePassword']; keyAlias ks['keyAlias']; keyPassword ks['keyPassword'] }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    bundle { language { enableSplit = false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'js', 'png', 'jpg', 'ogg', 'mp3', 'json' }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
